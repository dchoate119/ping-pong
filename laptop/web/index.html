<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Pong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hud">
      <div class="stat"><span class="label">STREAK</span><span id="streak">0</span></div>
      <div class="title">
        <h1>PING PONG</h1>
        <span id="level" class="level">EASY</span>
      </div>
      <div class="stat"><span class="label">RECORD</span><span id="record">0</span></div>
    </header>
    <div class="arena">
      <div class="stage">
        <img id="video" src="/video" alt="camera" />
        <canvas id="overlay"></canvas>
        <div id="swing" class="swing"></div>
        <div id="banner" class="banner">
          SWING TO SERVE
          <div class="hint">show a tag to change level</div>
        </div>
        <div id="hands" class="hands">
          <span class="label">PADDLE HAND</span>
          <button data-hand="left">LEFT</button>
          <button data-hand="right">RIGHT</button>
        </div>
        <div id="result" class="result"></div>
      </div>
      <div class="table-panel">
        <canvas id="table"></canvas>
      </div>
    </div>
    <footer>
      <span>
        <span id="conn" class="conn">connecting…</span>
        <span id="board" class="conn">board: offline</span>
        <span id="lane" class="conn">lane: none</span>
      </span>
      <span><span class="keys">T: switch view</span> <span id="fps"></span></span>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
